apiVersion: apps/v1
kind: Deployment

metadata:
  name: cheatsheet-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: cheatsheet
  
  template:
    metadata:
      labels:
        app: cheatsheet
    
    spec:
      containers:
        - name: cheatsheet-container
          image: cheatsheet-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80